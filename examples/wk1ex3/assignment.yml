title: Week 1 Exercise 3

engine: playwright

browser: chromium

headless: true

entry: wk1exercise3.html

testcases:

  - name: 2 + 3 = 5
    points: 10

    inputs:
      num1: "2"
      num2: "3"

    actions:
      - fill:
          selector: "#num1"
          value: "$num1"

      - fill:
          selector: "#num2"
          value: "$num2"

      - click:
          selector: "button"

    expect_console:
      equals: "5"


  - name: 10 + 20 = 30
    points: 10

    inputs:
      num1: "10"
      num2: "20"

    actions:
      - fill:
          selector: "#num1"
          value: "$num1"

      - fill:
          selector: "#num2"
          value: "$num2"

      - click:
          selector: "button"

    expect_console:
      equals: "30"


  - name: -5 + 8 = 3
    points: 10

    inputs:
      num1: "-5"
      num2: "8"

    actions:
      - fill:
          selector: "#num1"
          value: "$num1"

      - fill:
          selector: "#num2"
          value: "$num2"

      - click:
          selector: "button"

    expect_console:
      equals: "3"


  - name: Reject non-numeric input
    points: 10

    inputs:
      num1: "abc"
      num2: "5"

    actions:
      - fill:
          selector: "#num1"
          value: "$num1"

      - fill:
          selector: "#num2"
          value: "$num2"

      - click:
          selector: "button"

    expect_console:
      equals: "Please enter numbers only"