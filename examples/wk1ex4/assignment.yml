title: Week 1 Exercise 4

engine: playwright

browser: chromium

headless: false

entry: wk1exercise4_alt.html

testcases:

  - name: GET Post
    points: 10

    inputs: {}

    actions:
      - fill:
          selector: "#postID"
          value: "1"

      - click:
          selector: "text=GET Post"

      - wait:
          milliseconds: 1000

    expect_request:
      method: "GET"
      url_contains: "/posts/1"

  - name: POST Post
    points: 10

    inputs: {}

    actions:
      - fill:
          selector: "#title"
          value: "Hello"

      - fill:
          selector: "#body"
          value: "World"

      - click:
          selector: "text=POST Data"

      - wait:
          milliseconds: 1000

    expect_request:
      method: "POST"
      url_contains: "/posts"